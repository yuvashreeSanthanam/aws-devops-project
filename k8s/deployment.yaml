apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-app
          image: 591874025710.dkr.ecr.ap-south-1.amazonaws.com/aws-devops-project:latest
          ports:
            - containerPort: 5000