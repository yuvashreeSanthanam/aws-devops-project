name: CI/CD Pipeline - Build, Push & Deploy to EKS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # Step 1 - Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3 - Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4 - Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Step 5 - Push Docker Image to Amazon ECR
      - name: Push Docker Image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Step 6 - Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # Step 7 - Configure kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # Step 8 - Deploy latest build to EKS
      - name: Deploy to EKS
        run: |
          kubectl set image deployment/flask-app \
            flask-app=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Step 9 - Wait for deployment rollout
      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/flask-app

      # Step 10 - Show Deployment
      - name: Verify Deployment
        run: |
          kubectl get deployment flask-app

      # Step 11 - Show ReplicaSets
      - name: Verify ReplicaSets
        run: |
          kubectl get rs

      # Step 12 - Show Pods
      - name: Verify Pods
        run: |
          kubectl get pods -o wide

      # Step 13 - Show Services
      - name: Verify Services
        run: |
          kubectl get svc